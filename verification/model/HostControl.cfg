\* 参考模型 · F05 服务侧接管：两个插件实例、一个 HostControl、一个服务、R1/R2、一次迟到 unload。
\* 范围见 run-formal.mjs 的 SCOPE.HostControl；不覆盖控制体保密性与进程隔离。
CONSTANTS
    Instances = {"V1", "V2"}
    MaxReg = 2
    Mutant = "none"

SPECIFICATION Spec

INVARIANTS
    INV_F05_HOST_ONLY_BY_CONTROL
    INV_F05_NO_NULL_CLAIMANT
    INV_F05_NO_LABEL_AUTHORITY
    INV_F05_NO_ENCLAVE
    INV_F05_OLD_UNLOAD_KEEPS_R2
    INV_F05_RELEASE_TARGETS_LIVE
    INV_F05_REG_MONOTONE
    INV_F05_GHOSTS_NAMED
    INV_F05_CONTROL_REACHABLE
