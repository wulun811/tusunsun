\* 参考模型 · F06 依赖与停机次序（Shape = "chain"）
\*   a↔c 成环 · b→a 已装载 · b→ghost 缺席 —— 链 / 环 / 缺席三种形状同时在场。
\* 范围见 run-formal.mjs 的 SCOPE.Dependency；不覆盖环检测算法本身与进程隔离。
\*
\* 为什么图写在 .tla 里而不是 cfg 里：TLC 的 cfg 只认简单字面量，`<<a, b>>` 这种元组
\* 会报 "expecting }"。图固定在模块内的一份定义上，四份 cfg 只改 Mutant / Shape ——
\* 这也避免了「参考模型和突变体用的不是同一张图」这种假对照。
CONSTANTS
    Mutant = "m18-swallow-cycle"
    Shape = "chain"

SPECIFICATION Spec

INVARIANTS
    INV_F06_NO_PREMATURE_RELEASE
    INV_F06_BASIS_FAITHFUL
    INV_F06_NO_SILENT_UNRESOLVED
    INV_F06_NO_SILENT_CYCLE
    INV_F06_NO_FAKE_STOPPED
    INV_F06_GHOSTS_NAMED
    INV_F06_STOP_ENABLED
