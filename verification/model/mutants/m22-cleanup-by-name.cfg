\* 突变体 m22-cleanup-by-name：失败装配的清理只看服务名在不在，不看登记 ID，
\* 且只清对象与归属、留着登记 ID 与接管回执 —— 正是 rc.16 的 `discardAssemblyArtifacts`。
\* 应撞 INV_SR_NO_DANGLING_ID（对象没了、登记 ID 还在）。
CONSTANTS
    Attempts = {"a1", "a2"}
    MaxReg = 3
    Mutant = "cleanup-by-name"

SPECIFICATION Spec

INVARIANTS
    INV_SR_NO_DANGLING_ID
    INV_SR_CLEANUP_NO_WRONG_DELETE
    INV_SR_NO_DANGLING_TAKEOVER
    INV_SR_LIVE_HAS_ID
