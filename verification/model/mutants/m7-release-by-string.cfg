\* 突变体 m7-release-by-string：释放凭公开字符串过关（E-3 的形状：releaseCapability(id, ownerString)）
\* 应撞 INV_F01_NO_STRING_AUTH —— 撞不上就是模型对该偏差不敏感，run-formal.mjs 会因此退出 1。
CONSTANTS
    Instances = {"X1", "X2"}
    Handles = {"hA", "hB"}
    MaxReg = 2
    Mutant = "m7-release-by-string"

SPECIFICATION Spec

INVARIANTS
    INV_F01_NO_STRING_AUTH
    INV_F01_NO_ABA
    INV_F01_REAP_SCOPED
    INV_F01_HANDLE_TARGETS_LIVE
    INV_F01_HANDLE_IN_RANGE
    INV_F01_GHOSTS_BOOLEAN
    INV_F01_RELEASE_ENABLED
    INV_F01_REAP_ENABLED
