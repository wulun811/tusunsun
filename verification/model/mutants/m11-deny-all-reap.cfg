\* 突变体 m11-deny-all-reap：清场一律空转 —— 插件永远卸不干净
\* 应撞 INV_F01_REAP_ENABLED —— 撞不上就是模型对该偏差不敏感，run-formal.mjs 会因此退出 1。
CONSTANTS
    Instances = {"X1", "X2"}
    Handles = {"hA", "hB"}
    MaxReg = 2
    Mutant = "m11-deny-all-reap"

SPECIFICATION Spec

INVARIANTS
    INV_F01_NO_STRING_AUTH
    INV_F01_NO_ABA
    INV_F01_REAP_SCOPED
    INV_F01_HANDLE_TARGETS_LIVE
    INV_F01_HANDLE_IN_RANGE
    INV_F01_GHOSTS_BOOLEAN
    INV_F01_RELEASE_ENABLED
    INV_F01_REAP_ENABLED
