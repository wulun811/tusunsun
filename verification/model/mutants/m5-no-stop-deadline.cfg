\* 突变体 m5（本仓 H8 修前形状）：停机根本没有期限 —— 只有无限的等待
\* 预期失败形状不是不变量，而是 TLC 的 **Deadlock reached**（phase=1 且 stopClaim=0 出不去）。
CONSTANTS
    Plugins = {"A", "B"}
    Waiters = {"W1", "W2"}
    MaxEpoch = 3
    StopFault = TRUE
    Mutant = "m5-no-stop-deadline"

SPECIFICATION Spec

INVARIANTS
    INV_F04_MUTEX
    INV_F03_LEASE
    INV_F05_NO_STALE_WRITE
    INV_F08_NO_FAKE_STOPPED

PROPERTY StopBounded
