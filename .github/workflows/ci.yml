name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 全量套件：Linux + macOS。Windows 的完整 harness 套件包含 POSIX-only 的
  # 进程组/权限/符号链接用例，当前不宣称通过；Windows 由 windows-release 作业
  # 覆盖门禁、发行入口与安装验收。
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Build gates
        run: npm run check
      - name: Run all tests
        run: npm test

  # 打包 → 干净目录安装 → 真跑一次：用户拿到手能不能用的直接证据。
  package:
    name: package (npm pack → clean install → boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Pack
        run: npm pack
      - name: Install the tarball into a clean directory and boot
        run: |
          mkdir -p "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/tusunsun-*.tgz --no-audit --no-fund
          node node_modules/tusunsun/tusunsun.mjs --version

  windows-release:
    name: windows (node ${{ matrix.node-version }} / gates + install acceptance)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build gates
        run: npm run check
      - name: Offline installed bin, npm start and piped TUI input
        run: node --test test/windows-release.test.mjs
      - name: Smoke suite
        run: npm run test:smoke
      - name: Real install and HTTP SSE WebSocket lifecycle gate
        run: node scripts/install-acceptance.mjs --gate --nodes ${{ matrix.node-version }} --json test-results/windows-install-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-node-${{ matrix.node-version }}
          path: test-results/
