name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 全量套件：Linux + macOS。Windows 的完整 harness 套件包含 POSIX-only 的
  # 进程组/权限/符号链接用例，当前不宣称通过；Windows 由 windows-release 作业
  # 覆盖门禁、发行入口与安装验收。
  test:
    name: test (${{ matrix.os }} / node ${{ matrix.node-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm install
      - name: Build gates
        run: npm run check
      - name: Run all tests
        shell: bash
        run: |
          set +e
          npm test 2>&1 | tee test-output.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo "## npm test failed (rc=$rc)"
              echo '```text'
              grep -aE "FAIL|✗|Error|Summary|Total:|Failed:" test-output.log | tail -80 | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed 's/\x1b\[[0-9;]*m//g' test-output.log > test-output.clean.log
            {
              echo '--- last 12 lines ---'
              tail -12 test-output.clean.log
              echo '--- final summary ---'
              grep -aA 12 "=== Final Summary" test-output.clean.log | head -20
              echo '--- fails ---'
              grep -aA 4 -E "^ +FAIL |未被实际执行|Failed to load|用例数低于基线|退出码 [0-9]" test-output.clean.log | head -40
            } | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $rc

  # 打包 → 干净目录安装 → 真跑一次：用户拿到手能不能用的直接证据。
  package:
    name: package (npm pack → clean install → boot)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - name: Pack
        run: npm pack
      - name: Install the tarball into a clean directory and boot
        run: |
          mkdir -p "$RUNNER_TEMP/clean"
          cd "$RUNNER_TEMP/clean"
          npm init -y > /dev/null
          npm install "$GITHUB_WORKSPACE"/tusunsun-*.tgz --no-audit --no-fund
          node node_modules/tusunsun/tusunsun.mjs --version
      - name: Run the packaged test suite (artifact form)
        shell: bash
        run: |
          cd "$RUNNER_TEMP/clean/node_modules/tusunsun"
          set +e
          npm test 2>&1 | tee test-output.log
          rc=${PIPESTATUS[0]}
          if [ $rc -ne 0 ]; then
            {
              echo "## packaged npm test failed (rc=$rc)"
              echo '```text'
              grep -aE "FAIL|✗|Error|Summary|Total:|Failed:" test-output.log | tail -80 | sed 's/\x1b\[[0-9;]*m//g'
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            sed 's/\x1b\[[0-9;]*m//g' test-output.log > test-output.clean.log
            {
              echo '--- last 12 lines ---'
              tail -12 test-output.clean.log
              echo '--- final summary ---'
              grep -aA 12 "=== Final Summary" test-output.clean.log | head -20
              echo '--- fails ---'
              grep -aA 4 -E "^ +FAIL |未被实际执行|Failed to load|用例数低于基线|退出码 [0-9]" test-output.clean.log | head -40
            } | while IFS= read -r line; do echo "::error::${line:0:900}"; done
          fi
          exit $rc

  windows-release:
    name: windows (node ${{ matrix.node-version }} / gates + install acceptance)
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node-version: ['22']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Build gates
        run: npm run check
      - name: Offline installed bin, npm start and piped TUI input
        run: node --test test/windows-release.test.mjs
      - name: Smoke suite
        run: npm run test:smoke
      - name: Real install and HTTP SSE WebSocket lifecycle gate
        run: node scripts/install-acceptance.mjs --gate --nodes ${{ matrix.node-version }} --json test-results/windows-install-acceptance.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-release-node-${{ matrix.node-version }}
          path: test-results/
